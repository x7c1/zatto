name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

# Read-only: no CI job writes to the repository. Release.yml runs after this
# workflow succeeds on main.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The build compiles the GSettings schema with glib-compile-schemas.
      - name: Install glib-compile-schemas
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin

      - name: Run lint and format check
        run: npm run check:strict

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:run

      # The release scripts' offline tests (docs/guides/release.md).
      - name: Run release script tests
        run: |
          for t in .github/scripts/*.test.sh; do
            echo "::group::${t}"
            bash "$t" || exit 1
            echo "::endgroup::"
          done
