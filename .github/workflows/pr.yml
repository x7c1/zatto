name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

# Read-only: no CI job writes to the repository. Release.yml runs after this
# workflow succeeds on main.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # packages: read lets GITHUB_TOKEN install @haco-studio packages from
    # GitHub Packages (see .npmrc).
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The build compiles the GSettings schema with glib-compile-schemas.
      - name: Install glib-compile-schemas
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin

      - name: Run lint and format check
        run: npm run check:strict

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:run

      # The release scripts' offline tests (docs/guides/release.md).
      - name: Run release script tests
        run: |
          for t in .github/scripts/*.test.sh; do
            echo "::group::${t}"
            bash "$t" || exit 1
            echo "::endgroup::"
          done

  # Aggregates every job's result. This is the required check in the default branch's ruleset.
  # When adding a job, add it to needs as well.
  all-green:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              exit 1
            fi
          done
