name: Validate Release PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  # The job name is what branch protection requires; keep it.
  validate-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      # A PR whose title does not start with "Release v" is not a release PR:
      # pass at once, so this can be a required check on every PR.
      - name: Skip when not a release PR
        id: gate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^Release\ v ]]; then
            echo "Not a release PR (title='${PR_TITLE}'); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The PR's head, not the merge ref: the version checked is the one on
      # the release branch. Full history, so the last tag is reachable.
      - name: Checkout code
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release PR title
        if: steps.gate.outputs.skip != 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          .github/scripts/validate-release-pr-title.sh "$PR_TITLE" dist/metadata.json "$last_tag"

      # The summary region is what release.yml publishes as the GitHub
      # Release body. This workflow also runs on `edited`, so writing the
      # summary re-runs the check with no further push.
      - name: Validate release summary
        if: steps.gate.outputs.skip != 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: .github/scripts/validate-release-summary.sh "$PR_BODY"
