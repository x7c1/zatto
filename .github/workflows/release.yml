name: Release

# Cuts a Release when CI passes on a main commit that raised
# dist/metadata.json's version, i.e. the merge of a release PR. The jobs
# split by what they may write:
#
#   build (read; builds and packages) -> publish (contents: write; gh only)
#     -> rewrite-links (pull-requests: write)
#
# Only `publish` can change a Release, and it neither checks out nor runs
# project code. See docs/guides/release.md.

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

# Every job states what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A red CI must never cut a release. Only a push to main counts: the
    # `branches` filter matches a pull_request run by its head branch name,
    # so a fork's branch named `main` would pass it too.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}

    permissions:
      contents: read
      pull-requests: read

    outputs:
      changed: ${{ steps.version-check.outputs.changed }}
      version: ${{ steps.version-check.outputs.version }}
      filename: ${{ steps.package.outputs.filename }}
      body: ${{ steps.summary.outputs.body }}

    steps:
      # The commit CI tested, not the branch tip: another merge may have
      # landed on main since that CI run started.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check if version changed
        id: version-check
        run: .github/scripts/check-version-change.sh

      # The Release body is the summary written in the merged release PR,
      # followed by links to that PR (with the per-commit changelog) and the
      # compare view. Resolved before anything is built, so a missing summary
      # fails the run before a Release exists.
      - name: Resolve release summary
        if: steps.version-check.outputs.changed == 'true'
        id: summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NEW_VERSION: ${{ steps.version-check.outputs.version }}
        run: |
          source .github/scripts/release-summary.sh
          source .github/scripts/release-pr-lookup.sh

          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          # The tag of this release does not exist yet, so this is the
          # previous one (empty for the first release).
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          pr_number=$(find_release_pr "$NEW_VERSION")
          if [ -z "$pr_number" ]; then
            echo "::error::No merged release PR titled 'Release v${NEW_VERSION}' found; its summary is what this Release publishes. See docs/guides/release.md."
            exit 1
          fi

          # Fetch in a statement of its own so a failed API call aborts the
          # step rather than reading as an unwritten summary.
          pr_body=$(gh pr view "$pr_number" --json body --jq '.body')
          summary=$(summary_region "$pr_body")
          if summary_is_unwritten "$summary"; then
            echo "::error::Release PR #${pr_number} carries no release summary. Write it above the '$(changelog_marker)' marker in the PR body and delete the '$(summary_sentinel)' comment, then re-run this workflow. See docs/guides/release.md."
            exit 1
          fi

          # Randomize the heredoc delimiter: the summary is free-form prose
          # and must not be able to terminate its own output block.
          delimiter="RELEASE_BODY_$(openssl rand -hex 16)"
          {
            echo "body<<${delimiter}"
            printf '%s\n\n---\n\n' "$summary"
            printf -- '- Release PR: %s/pull/%s\n' "$repo_url" "$pr_number"
            if [ -n "$last_tag" ]; then
              printf -- '- Compare: [%s...v%s](%s/compare/%s...v%s)\n' \
                "$last_tag" "$NEW_VERSION" \
                "$repo_url" "$last_tag" "$NEW_VERSION"
            fi
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.version-check.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      # No npm cache: a release build restores nothing a pull request run
      # could have written.
      - name: Install dependencies
        if: steps.version-check.outputs.changed == 'true'
        run: npm ci

      - name: Build extension
        if: steps.version-check.outputs.changed == 'true'
        run: npm run build:release

      - name: Package extension
        if: steps.version-check.outputs.changed == 'true'
        id: package
        env:
          UUID: ${{ steps.version-check.outputs.uuid }}
          VERSION: ${{ steps.version-check.outputs.version }}
        run: .github/scripts/package-extension.sh "$UUID" "$VERSION"

      - name: Upload the package
        if: steps.version-check.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shell-extension
          path: ${{ steps.package.outputs.filename }}
          if-no-files-found: error
          overwrite: true

  # Runs only gh and download-artifact. The Release is created as a draft,
  # gets the package attached and checked, and only then is published, which
  # creates the tag v<version> at the commit CI tested. A re-run finds the
  # draft it created before and updates it.
  publish:
    needs: build
    if: ${{ needs.build.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.build.outputs.version }}
      TITLE: Release v${{ needs.build.outputs.version }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BODY: ${{ needs.build.outputs.body }}
      FILENAME: ${{ needs.build.outputs.filename }}
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shell-extension
          path: package

      - name: Check the package
        run: |
          case "$FILENAME" in
            *.shell-extension.zip) ;;
            *)
              echo "::error::Unexpected package name '${FILENAME}'."
              exit 1
              ;;
          esac
          if [ ! -f "package/${FILENAME}" ]; then
            echo "::error::The build job produced no ${FILENAME}."
            exit 1
          fi

      - name: Create or update the draft Release
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          printf '%s\n' "$BODY" > "$notes"

          # Empty when no Release (draft or not) carries the tag name.
          is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          case "$is_draft" in
            true)
              echo "Updating the existing draft ${TAG}."
              gh release edit "$TAG" --title "$TITLE" --notes-file "$notes" --target "$SHA"
              ;;
            false)
              echo "::error::${TAG} is already published."
              exit 1
              ;;
            *)
              gh release create "$TAG" --draft --title "$TITLE" --notes-file "$notes" --target "$SHA"
              ;;
          esac

      # --clobber: a re-run replaces what an earlier attempt attached.
      - name: Attach the shell-extension.zip
        run: gh release upload "$TAG" "package/${FILENAME}" --clobber

      - name: Check the package is attached
        run: |
          attached=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          printf 'Attached:\n%s\n' "$attached"
          if ! grep -qxF -- "$FILENAME" <<< "$attached"; then
            echo "::error::${TAG} lacks ${FILENAME}."
            exit 1
          fi

      - name: Publish the Release
        run: gh release edit "$TAG" --draft=false

  # Needs the tag, which exists only once the Release is published.
  rewrite-links:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Rewrite the release PR's compare link to the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NEW_VERSION: ${{ needs.build.outputs.version }}
        run: .github/scripts/update-release-pr-links.sh "$NEW_VERSION"
