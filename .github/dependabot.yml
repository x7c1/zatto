# Weekly update pull requests, on Monday morning (Asia/Tokyo).
#
# Minor and patch updates of each ecosystem arrive as one grouped pull
# request, since they rarely break anything and one CI run covers them all.
# Major updates stay one pull request each, so a failing one points at the
# dependency that broke. Security updates are not grouped.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # @haco-studio/* comes from GitHub Packages, which Dependabot cannot read
      # without a registry secret, so it is bumped by hand.
      - dependency-name: "@haco-studio/*"
      # The @girs/* major follows the GNOME Shell version the extension
      # targets (shell-version in dist/metadata.json): types for a newer Shell
      # let calls to APIs missing from the targeted one compile. So a major
      # update is made by hand, in the change that moves shell-version. Not a
      # versions range: @girs/gnome-shell is numbered after the Shell itself.
      - dependency-name: "@girs/*"
        update-types: ["version-update:semver-major"]
